<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .hero {
          width: 100%;
          height: 240px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
          background-size: 200% 200%;
          animation: gradientShift 8s ease infinite;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
          border-radius: 16px;
        }
        .hero::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 20% 50%, rgba(99,102,241,0.3) 0%, transparent 50%),
                      radial-gradient(circle at 80% 50%, rgba(139,92,246,0.2) 0%, transparent 50%);
        }
        .dots {
          position: absolute;
          inset: 0;
          opacity: 0.15;
          background-image: radial-gradient(circle, #fff 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .content { position: relative; z-index: 1; text-align: center; padding: 0 24px; }
        .badge {
          display: inline-block;
          background: rgba(99,102,241,0.25);
          border: 1px solid rgba(99,102,241,0.5);
          color: #a5b4fc;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 2px;
          text-transform: uppercase;
          padding: 6px 16px;
          border-radius: 999px;
          margin-bottom: 12px;
        }
        h1 {
          color: #f8fafc;
          font-size: 32px;
          font-weight: 800;
          letter-spacing: -0.5px;
          line-height: 1.2;
        }
        .highlight {
          background: linear-gradient(90deg, #818cf8, #c084fc, #f472b6);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .subtitle {
          color: #94a3b8;
          font-size: 15px;
          margin-top: 10px;
          font-weight: 400;
        }
        .location {
          color: #64748b;
          font-size: 13px;
          margin-top: 8px;
        }
        .tags {
          display: flex;
          gap: 8px;
          justify-content: center;
          margin-top: 16px;
          flex-wrap: wrap;
        }
        .tag {
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.12);
          color: #e2e8f0;
          font-size: 11px;
          padding: 4px 12px;
          border-radius: 6px;
          font-family: "Fira Code", "Cascadia Code", monospace;
        }
        @keyframes gradientShift {
          0%, 100% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
        }
        @media (prefers-color-scheme: light) {
          .hero {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 40%, #c7d2fe 70%, #a5b4fc 100%);
          }
          h1 { color: #1e1b4b; }
          .subtitle { color: #475569; }
          .location { color: #64748b; }
          .badge { background: rgba(99,102,241,0.15); color: #4338ca; border-color: rgba(99,102,241,0.3); }
          .tag { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.2); color: #3730a3; }
        }
        @media (prefers-reduced-motion: reduce) {
          .hero { animation: none; }
        }
      </style>
      <div class="hero">
        <div class="dots"></div>
        <div class="content">
          <div class="badge">=K Ol�, eu sou</div>
          <h1>Luiz Filipe <span class="highlight">Schaeffer</span></h1>
          <p class="subtitle">Desenvolvedor Mobile Flutter � Analista de Suporte � Fullstack em constru��o</p>
          <p class="location">=� Crici�ma, Santa Catarina  Brasil</p>
          <div class="tags">
            <span class="tag">&lt;Flutter /&gt;</span>
            <span class="tag">&lt;HTML /&gt;</span>
            <span class="tag">&lt;CSS /&gt;</span>
            <span class="tag">&lt;React /&gt;</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
