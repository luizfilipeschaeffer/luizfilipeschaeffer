<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .cta {
          width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: linear-gradient(135deg, #1e1b4b, #312e81);
          border-radius: 16px;
          padding: 28px 32px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border: 1px solid rgba(99,102,241,0.3);
        }
        .text h3 { color: #f8fafc; font-size: 20px; font-weight: 700; }
        .text p { color: #a5b4fc; font-size: 13px; margin-top: 4px; }
        .buttons { display: flex; gap: 10px; flex-shrink: 0; }
        .btn {
          display: inline-block;
          padding: 10px 20px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          text-decoration: none;
          color: white;
        }
        .btn-primary { background: #6366f1; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        @media (prefers-color-scheme: light) {
          .cta { background: linear-gradient(135deg, #eef2ff, #e0e7ff); border-color: #c7d2fe; }
          .text h3 { color: #1e1b4b; }
          .text p { color: #4338ca; }
        }
      </style>
      <div class="cta">
        <div class="text">
          <h3>Vamos trabalhar juntos?</h3>
          <p>Projetos Flutter, web e parcerias  resposta em at� 24h</p>
        </div>
        <div class="buttons">
          <a class="btn btn-primary" href="https://luizfilipeschaeffer.dev/">Portfolio</a>
          <a class="btn btn-secondary" href="mailto:contato@luizfilipeschaeffer.dev">Email</a>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
