<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .panel {
          width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 16px;
          padding: 24px;
        }
        .header {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 20px;
          padding-bottom: 16px;
          border-bottom: 1px solid #21262d;
        }
        .header-icon {
          width: 40px;
          height: 40px;
          background: linear-gradient(135deg, #e34c26, #f06529);
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          font-weight: 800;
          color: white;
        }
        .header-text h2 { color: #f0f6fc; font-size: 18px; font-weight: 700; }
        .header-text p { color: #8b949e; font-size: 12px; margin-top: 2px; }
        .skills { display: flex; flex-direction: column; gap: 14px; }
        .skill-row { display: flex; align-items: center; gap: 12px; }
        .skill-name {
          width: 100px;
          font-size: 12px;
          font-weight: 600;
          color: #c9d1d9;
          font-family: "Fira Code", monospace;
          text-align: right;
          flex-shrink: 0;
        }
        .bar-track {
          flex: 1;
          height: 10px;
          background: #21262d;
          border-radius: 999px;
          overflow: hidden;
        }
        .bar-fill {
          height: 100%;
          border-radius: 999px;
          animation: fillIn 1.5s ease-out forwards;
        }
        .html { width: 85%; background: linear-gradient(90deg, #e34c26, #f06529); }
        .css  { width: 85%; background: linear-gradient(90deg, #264de4, #2965f1); }
        .js   { width: 75%; background: linear-gradient(90deg, #f0db4f, #f7df1e); }
        .react{ width: 70%; background: linear-gradient(90deg, #61dafb, #21a1c4); }
        .next { width: 65%; background: linear-gradient(90deg, #fff, #888); }
        .ts   { width: 60%; background: linear-gradient(90deg, #3178c6, #235a97); }
        .pct {
          width: 36px;
          font-size: 11px;
          font-weight: 700;
          color: #8b949e;
          font-family: "Fira Code", monospace;
        }
        .code-preview {
          margin-top: 20px;
          background: #161b22;
          border: 1px solid #30363d;
          border-radius: 10px;
          padding: 14px 16px;
          font-family: "Fira Code", "Cascadia Code", monospace;
          font-size: 11px;
          line-height: 1.6;
        }
        .code-preview .tag { color: #7ee787; }
        .code-preview .attr { color: #79c0ff; }
        .code-preview .val { color: #a5d6ff; }
        .code-preview .sel { color: #ff7b72; }
        .code-preview .prop { color: #d2a8ff; }
        @keyframes fillIn {
          from { width: 0; }
        }
        @media (prefers-color-scheme: light) {
          .panel { background: #ffffff; border-color: #d0d7de; }
          .header { border-color: #d8dee4; }
          .header-text h2 { color: #1f2328; }
          .skill-name { color: #1f2328; }
          .bar-track { background: #eaeef2; }
          .code-preview { background: #f6f8fa; border-color: #d0d7de; }
        }
        @media (prefers-reduced-motion: reduce) {
          .bar-fill { animation: none; }
        }
      </style>
      <div class="panel">
        <div class="header">
          <div class="header-icon">&lt;/&gt;</div>
          <div class="header-text">
            <h2>Web &amp; Frontend</h2>
            <p>HTML sem�ntico � CSS moderno � JavaScript � React � Next.js</p>
          </div>
        </div>
        <div class="skills">
          <div class="skill-row"><span class="skill-name">HTML</span><div class="bar-track"><div class="bar-fill html"></div></div><span class="pct">85%</span></div>
          <div class="skill-row"><span class="skill-name">CSS</span><div class="bar-track"><div class="bar-fill css"></div></div><span class="pct">85%</span></div>
          <div class="skill-row"><span class="skill-name">JS</span><div class="bar-track"><div class="bar-fill js"></div></div><span class="pct">75%</span></div>
          <div class="skill-row"><span class="skill-name">React</span><div class="bar-track"><div class="bar-fill react"></div></div><span class="pct">70%</span></div>
          <div class="skill-row"><span class="skill-name">Next.js</span><div class="bar-track"><div class="bar-fill next"></div></div><span class="pct">65%</span></div>
          <div class="skill-row"><span class="skill-name">TS</span><div class="bar-track"><div class="bar-fill ts"></div></div><span class="pct">60%</span></div>
        </div>
        <div class="code-preview">
          <span class="tag">&lt;section</span> <span class="attr">class</span>=<span class="val">"hero"</span><span class="tag">&gt;</span><br/>
          &nbsp;&nbsp;<span class="tag">&lt;h1&gt;</span>Luiz Filipe Schaeffer<span class="tag">&lt;/h1&gt;</span><br/>
          &nbsp;&nbsp;<span class="tag">&lt;style&gt;</span><br/>
          &nbsp;&nbsp;&nbsp;&nbsp;<span class="sel">.hero</span> { <span class="prop">display</span>: flex; <span class="prop">gap</span>: 1rem; }<br/>
          &nbsp;&nbsp;<span class="tag">&lt;/style&gt;</span><br/>
          <span class="tag">&lt;/section&gt;</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
