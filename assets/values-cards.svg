  <text x="128" y="44" text-anchor="middle" font-size="26">&#x1F3AF;</text>
  <text x="128" y="72" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Foco em Resultados</text>
